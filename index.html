<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | MyResume</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <style>
      /* حذف کامل حاشیه و پدینگ */
      html, body {
        padding: 0;
        margin: 0;
        overflow: hidden; /* جلوگیری از نمایش اسکرول بار */
      }
      /* تنظیم کانتینر و canvas برای پر کردن کل صفحه */
      #unity-container.unity-desktop, #unity-canvas {
        width: 100vw;
        height: 100vh;
      }
      /* مخفی کردن نوار پایین یونیتی (که دکمه فول اسکرین را دارد) */
      #unity-footer {
        display: none !important;
      }
    </style>
    </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width=960 height=600 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-logo-title-footer"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">MyResume</div>
      </div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var container = document.querySelector("#unity-container");

      function unityShowBanner(msg, type) {
        // ... (این تابع بدون تغییر باقی می‌ماند)
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/4.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/4.data",
        frameworkUrl: buildUrl + "/4.framework.js",
        codeUrl: buildUrl + "/4.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "MyResume",
        productVersion: "1.0",
        showBanner: unityShowBanner,
      };

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        container.className = "unity-mobile";
        canvas.className = "unity-mobile";
      } else {
        // سایزهای ثابت حذف شده‌اند تا CSS کار کند
      }

      document.querySelector("#unity-loading-bar").style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          document.querySelector("#unity-loading-bar").style.display = "none";
          
          // START: تغییر اصلی اینجاست
          // به جای استفاده از دکمه یونیتی، با اولین کلیک کاربر، صفحه را تمام‌صفحه می‌کنیم
          function enterFullscreen() {
            // از API استاندارد مرورگر استفاده می‌کنیم
            document.documentElement.requestFullscreen().catch((err) => {
              console.log(`Error attempting to enable full-screen mode: ${err.message} (${err.name})`);
            });
            // رویداد را حذف می‌کنیم تا دوباره اجرا نشود
            document.removeEventListener('click', enterFullscreen);
          }
          // یک رویداد کلیک به صفحه اضافه می‌کنیم
          document.addEventListener('click', enterFullscreen);
          // END: تغییر اصلی

        }).catch((message) => {
          alert(message);
        });
      };

      document.body.appendChild(script);

    </script>
  </body>
</html>
